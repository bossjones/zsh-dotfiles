      - id: minitop-xcode-shims-broken
        title: /usr/bin/make, clang and xcrun fail to load through Xcode 26.6
        type: command
        observed: "2026-08-31"
        expected: /usr/bin/make --version exits 0
        tracked: "#138"
        traces: [C3]
        run: /usr/bin/make --version
        want_stderr_matching: "Failed to locate 'make'"
        fix: |
          xcode-select points at Xcode.app 26.6 (17F113) on macOS 26.6.2, and
          its loader dies with `Symbol not found: _XPCTypeBool` (CoreDevice ->
          Mercury.framework). The standalone CLT 26.6.0 is healthy. Every
          Makefile target -- doctor-test, smoke-doctor, test -- fails before
          running; the survey ran the underlying commands directly. Operator
          choice: `sudo xcode-select -s /Library/Developer/CommandLineTools`,
          or repair Xcode. Blocks anything that compiles (sheldon from source).
