# zsh-dotfiles convergence doctor -- fleet definition
#
#   common      every machine
#   profiles    every machine of that profile   <- the TARGET state
#   hosts       identity + tracked drift only   <- TODAY's state
#
# There is deliberately no hosts.<h>.checks key. A permanent per-host assertion
# has no home here: express an inherent difference as a `when:` gate on a
# profile-level check, and a temporary one as tracked drift.
#
# Design: specs/migration-doctor.md
# Findings: specs/unified-dotfiles-gap-analysis.md
#
# PUBLIC REPO -- no IPs, no credentials, no key paths. Machine names only.

version: 1

defaults:
  timeout: 15
  shell: /bin/zsh

# ---------------------------------------------------------------------------
# common -- true on every machine in the fleet
# ---------------------------------------------------------------------------

common:
  checks:
    # --- preconditions: must hold BEFORE migrating -------------------------

    - id: no-resurrected-files
      title: no files resurrected relative to origin/main
      type: command
      phase: pre
      traces: [C2]
      run: git -C ~/.local/share/chezmoi diff --diff-filter=A --name-only origin/main HEAD
      want_stdout_empty: true
      fix: |
        A merge resurrected files deleted on main. Review each before applying;
        this broke Copilot CLI on the work machine once already.

    - id: gh-account-can-push
      title: the active gh account matches the origin remote protocol
      type: command
      phase: pre
      traces: [C5]
      run: gh auth status 2>&1
      want_exit: 0
      fix: |
        gh auth switch --user bossjones   # for personal repos
        Verify `git remote -v` protocol agrees with `gh auth status`.

    - id: chezmoi-config-has-every-key
      title: chezmoi config carries every key the templates declare
      type: chezmoi_data_complete
      phase: always
      traces: [C3, "#129"]
      path: ~/.local/share/chezmoi/home/.chezmoi.yaml.tmpl
      fix: |
        A flag was introduced after this machine's last apply. Because hasKey
        is false for an ABSENT key, the prompt fires -- re-running init fixes it:
          cd ~/.local/share/chezmoi && chezmoi init --source=. <all --promptString/-Bool>
        Never hand-edit chezmoi.yaml to add fzf_tab: plugins.toml.tmpl:135
        dereferences .myFzfTabRev, which only .chezmoi.yaml.tmpl:147 emits, and
        missingkey=error turns the omission into a failed apply.

    # --- target state: asserted AFTER migrating ----------------------------

    - id: chezmoi-version-manager-mise
      title: version_manager resolves to mise
      type: chezmoi_data
      phase: post
      traces: [S6, "#126"]
      key: version_manager
      want: mise

    - id: chezmoi-fzf-tab-present-and-false
      title: fzf_tab is present in the config and off by default
      type: chezmoi_data
      phase: post
      traces: [C1, C3, "#129"]
      key: fzf_tab
      want: false
      fix: |
        The key must be PRESENT and false -- absent is what leaves plugins.toml.tmpl
        guarding on hasKey. Set it with `chezmoi init --promptBool fzf_tab=false`
        in a real TTY.
        To opt in later, use init again -- NEVER hand-edit chezmoi.yaml to set it
        true, because plugins.toml.tmpl:135 then dereferences .myFzfTabRev, which
        only .chezmoi.yaml.tmpl:147 emits, and missingkey=error fails the apply.

    - id: chezmoi-cuda-false-on-macos
      title: cuda is false on macOS
      type: chezmoi_data
      phase: post
      traces: [C1, Q8]
      when: { os: darwin }
      key: cuda
      want: false
      fix: cuda is a Linux concern; revisit when boss-deeplearning enters scope.

    - id: chezmoi-opencv-false-on-macos
      title: opencv is false on macOS
      type: chezmoi_data
      phase: post
      traces: [C1, Q8]
      when: { os: darwin }
      key: opencv
      want: false

    - id: gitignore-claude-settings-local
      title: gitignore_global excludes .claude/settings.local.json
      type: file_contains
      phase: post
      traces: [S1, "#121"]
      path: ~/.gitignore_global
      want: "**/.claude/settings.local.json"
      fix: Append `**/.claude/settings.local.json` to home/dot_gitignore_global.

    - id: git-default-branch-main
      title: init.defaultBranch is main
      type: git_config
      phase: post
      traces: [S2, "#119"]
      key: init.defaultBranch
      want: main

    - id: git-core-editor
      title: core.editor is vim
      type: git_config
      phase: post
      traces: [S5, "#119"]
      key: core.editor
      want: vim

    - id: zshrc-local-template-gone
      title: the dead ~/.zshrc.local template no longer renders
      type: file_exists
      phase: post
      traces: [S7, "#129"]
      path: ~/.local/share/chezmoi/home/dot_zshrc.local.tmpl
      want: absent
      fix: |
        git rm home/dot_zshrc.local.tmpl -- nothing sources it, and the rendered
        file sets stale values (RBENV_VERSION=2.7.2, SHELL=/opt/homebrew/bin/zsh)
        that would ACTIVATE if anything ever did.

    - id: vimrc-is-upstream-symlink
      title: ~/.vimrc is the gpakosz relative symlink
      type: symlink
      phase: post
      traces: [M4, Q1, "#124"]
      path: ~/.vimrc
      target: .vim/.vimrc
      fix: |
        git rm home/dot_vimrc is mandatory -- both present yields
        ".vimrc: inconsistent state", exit 1.

    - id: mise-installed
      title: mise is on PATH
      type: binary
      phase: post
      traces: [S6, "#126"]
      name: mise

    - id: asdf-tool-versions-backed-up
      title: the pre-migration asdf tool-versions is preserved
      type: file_exists
      phase: post
      traces: [S6, C4, "#126"]
      path: ~/.tool-versions.asdf.bak

    - id: asdf-data-untouched
      title: ~/.asdf still exists as the rollback path
      type: file_exists
      phase: post
      traces: [C4, "#126"]
      path: ~/.asdf

    # --- invariants --------------------------------------------------------

    - id: shell-starts-clean
      title: an interactive zsh exits 0
      type: command
      traces: [S3]
      run: zsh -i -c exit
      want_exit: 0
      fix: Compare stderr against the recorded baseline, not against an empty set.

    - id: chezmoi-templates-render
      title: chezmoi can render every template
      type: command
      traces: [C3]
      run: chezmoi status --source=$HOME/.local/share/chezmoi
      want_exit: 0
      fix: |
        A template error here usually means a missing data key --
        see chezmoi-config-has-every-key.

# ---------------------------------------------------------------------------
# profiles -- the target shape for every machine of this kind
# ---------------------------------------------------------------------------

profiles:
  work:
    checks:
      - id: work-hub-host-is-corp
        title: hub.host points at the Adobe enterprise host
        type: git_config
        phase: post
        traces: [M2, Q3, "#119"]
        key: hub.host
        want: git.corp.adobe.com
        fix: Work only. On personal this key must be ABSENT -- it breaks `git pr`.

      - id: work-identity-files-managed
        title: three gitconfig identity files are chezmoi-managed
        type: chezmoi_managed
        phase: post
        traces: [M1, Q4, "#120"]
        pattern: "gitconfig-"
        count: 3

      - id: work-adobe-corp-identity
        title: ~/dev/malcolm resolves to the Adobe identity
        type: git_config
        phase: post
        traces: [M1, "#120"]
        cwd: ~/dev/malcolm
        key: user.email
        want: malcolm@adobe.com
        fix: includeIf is last-wins -- the routing block must stay LAST in the file.

      - id: work-personal-identity-routing
        title: ~/dev/bossjones resolves to the personal identity
        type: git_config
        phase: post
        traces: [M1, "#120"]
        cwd: ~/dev/bossjones
        key: user.email
        want: bossjones@theblacktonystark.com

      - id: work-personal-url-rewrite
        title: ~/dev/bossjones gets the personal URL rewrite
        type: git_config
        phase: post
        traces: [M1, "#120"]
        cwd: ~/dev/bossjones
        key: url.git@github.com:.insteadOf
        want: https://github.com/
        fix: |
          user.email alone does NOT prove the bossjones include matched --
          both identity files set an email. Assert the rewrite too.

  personal:
    checks:
      - id: personal-no-adobe-references
        title: the rendered gitconfig carries no Adobe references
        type: command
        phase: post
        traces: [M2, "#119"]
        run: chezmoi cat ~/.gitconfig
        want_stdout_not_matching: "(?i)adobe"
        fix: |
          hub.host must be absent under profile=personal. It does not merely leak
          a hostname -- it points `git pr` at Adobe's GHE, where personal repos
          do not exist.

      - id: personal-no-identity-files
        title: no gitconfig identity files are managed
        type: chezmoi_managed
        phase: post
        traces: [M1, "#120"]
        pattern: "gitconfig-"
        count: 0

      - id: personal-no-includeif
        title: the gitconfig declares no includeIf routing
        type: command
        phase: post
        traces: [M1, "#119"]
        run: chezmoi cat ~/.gitconfig
        want_stdout_not_matching: "includeIf"

      - id: personal-pyenv-true
        title: pyenv is true (the one live boolean on macOS)
        type: chezmoi_data
        phase: post
        traces: [C1, "#116"]
        key: pyenv
        want: true
        fix: |
          Owner decision on #137 (2026-08-31): pyenv owns python3 on both
          personal machines, so the flag is true for the profile. Present-but-
          wrong today on both (sticky) -- corrected at the --data=false init.

      - id: personal-inert-flags-honest
        title: ruby, nodejs, k8s and fnm are true (installed on every personal host)
        type: command
        phase: post
        traces: [C1, "#116"]
        run: chezmoi data --format json
        want_stdout_not_matching: '"(ruby|nodejs|k8s|fnm)": false'
        fix: |
          Inert -- no template reads them -- recorded for honesty only. Owner
          answered true for all four on #137; supertop's spec validation block
          says the same. Set at the corrective init, never by hand.

# ---------------------------------------------------------------------------
# hosts -- identity, and tracked drift only
# ---------------------------------------------------------------------------

hosts:
  adobetop:
    description: >-
      Work machine. Surveyed 2026-08-31: macOS 15.7.9 (24G830), arm64,
      chezmoi 2.72.0.
    identity:
      profile: work
      match:
        arch: arm64
        username: malcolm
        os: darwin
      assert:
        computer_name: adobetop
        local_host_name: adobetop
        os_major: 15

    drift:
      - id: adobetop-missing-chezmoi-keys
        title: chezmoi config predates version_manager, fzf_tab and profile
        type: command
        observed: "2026-08-31"
        expected: all three keys present
        tracked: "#129"
        traces: [C3, Q17]
        run: chezmoi data --format json
        want_stdout_not_matching: '"version_manager"'
        fix: |
          The keys are ABSENT, not wrong -- hasKey is false, so a plain re-run of
          `chezmoi init` with the full prompt set sets all three. Stickiness only
          bites where a key already exists.

      - id: adobetop-cuda-true-on-macos
        title: cuda is true on a macOS host
        type: chezmoi_data
        observed: "2026-08-31"
        expected: "false"
        tracked: "#101"
        traces: [C1, Q8]
        key: cuda
        want: true
        fix: Inert today; corrected when the config is regenerated.

      - id: adobetop-opencv-true-on-macos
        title: opencv is true on a macOS host
        type: chezmoi_data
        observed: "2026-08-31"
        expected: "false"
        tracked: "#101"
        traces: [C1, Q8]
        key: opencv
        want: true

      # NOTE: `scutil --get HostName` is unset here, and that is deliberately
      # NOT recorded as drift -- unset is the macOS default on a healthy
      # machine (see specs/migration-doctor.md). ComputerName and LocalHostName
      # are the values that matter, and both are correct. Q12 may set HostName
      # fleet-wide later; until then there is no deviation to track.

      - id: adobetop-stale-version-key-names
        title: config carries the pre-rename myAsdf*Version keys
        type: command
        observed: "2026-08-31"
        expected: the my*Version names the template now declares
        tracked: "#129"
        traces: [C3]
        run: chezmoi data --format json
        want_stdout_matching: '"myAsdfRubyVersion"'
        fix: |
          The template renamed myAsdf*Version -> my*Version (19 keys) and added
          myPyenvPythonVersion, myWtpVersion, myFzfTabRev. With missingkey=error
          this is why `chezmoi status` exits 1 on this machine -- the full
          mechanism behind C3. Re-running `chezmoi init` regenerates all of them.

      - id: adobetop-tmux-conf-absolute-symlink
        title: ~/.tmux.conf symlinks to an absolute path containing the username
        type: symlink
        observed: "2026-08-31"
        expected: a portable, chezmoi-managed link
        tracked: "#125"
        traces: [Q2]
        path: ~/.tmux.conf
        target_matching: "^/Users/malcolm/"
        fix: |
          The target hardcodes /Users/malcolm, so it cannot work on a bossjones
          machine. This is within-profile divergence, not a personal-only issue.

  supertop:
    description: >-
      Personal Apple Silicon laptop (Mac16,5, M4 Max). Surveyed 2026-08-31
      on-machine (#136): macOS 26.5.2 (25F84), arm64, chezmoi 2.72.0.
      Formerly named "Mac" / Mac.scarlettlab.home -- this is the machine the
      input specs called "the personal machine" (Q10 resolved; see
      specs/personal-dotfiles-gap-analysis.md).
    identity:
      profile: personal
      match:
        arch: arm64
        username: bossjones
        os: darwin
      assert:
        computer_name: supertop
        local_host_name: supertop
        os_major: 26

    drift:
      - id: supertop-missing-chezmoi-keys
        title: chezmoi config predates fzf_tab and myFzfTabRev
        type: command
        observed: "2026-08-31"
        expected: both keys present
        tracked: "#129"
        traces: [C3]
        run: chezmoi data --format json
        want_stdout_not_matching: '"myFzfTabRev"'
        fix: |
          The keys are ABSENT, not wrong -- hasKey is false, so a plain re-run
          of `chezmoi init` sets both. Only 2 keys short here, against
          adobetop's 22: this config was regenerated after the my*Version
          rename but before fzf_tab was introduced.

      - id: supertop-version-manager-asdf
        title: version_manager is asdf; the fleet target is mise
        type: chezmoi_data
        observed: "2026-08-31"
        expected: mise
        tracked: "#126"
        traces: [S6]
        key: version_manager
        want: asdf
        fix: |
          Present-but-wrong, so hasKey short-circuits every prompt including
          --promptString. Corrective init needs --data=false, or a prior
          hand-edit of ~/.config/chezmoi/chezmoi.yaml.

      - id: supertop-stale-identity-data-keys
        title: the hostname data key still says bossworkstation
        type: chezmoi_data
        observed: "2026-08-31"
        expected: supertop
        tracked: "#116"
        traces: [Q6, Q12]
        key: hostname
        want: bossworkstation
        fix: |
          computer_name ("boss workstation") shares the fate. Both are
          present-but-wrong (sticky) and, since Q6/Q12, load-bearing -- they
          feed the hostname setter script. Same --data=false / hand-edit
          remedy as version_manager.

      - id: supertop-hub-host-adobe
        title: global hub.host points at Adobe's GHE on a personal machine
        type: git_config
        observed: "2026-08-31"
        expected: key absent on profile=personal
        tracked: "#119"
        traces: [M2]
        key: hub.host
        want: git.corp.adobe.com
        fix: |
          hub IS installed here and dot_gitconfig wires `git pr` through it,
          so this actively points `git pr` at git.corp.adobe.com. Resolved by
          the profile gate (S3/M2), not by hand-editing the live file.

      - id: supertop-zshrc-local-present
        title: ~/.zshrc.local exists with stale values
        type: file_exists
        observed: "2026-08-31"
        expected: file removed
        tracked: "#129"
        traces: [S7]
        path: ~/.zshrc.local
        fix: |
          3.3K of live-but-stale config (RBENV_VERSION=2.7.2, export SHELL=...).
          Nothing in home/ sources it; S7 deletes the template rather than
          sourcing this file, because sourcing would ACTIVATE the stale values.

  minitop:
    description: >-
      Personal Apple Silicon Mac mini (Mac16,11, M4 Pro), ssh host `mac-mini`.
      Surveyed 2026-08-31 on-machine (#137): macOS 26.6.2 (25G83), arm64,
      chezmoi 2.31.1 at ~/.bin/chezmoi. Q10 resolved: NOT Mac.scarlettlab.home
      (that was supertop pre-rename). Live names: ComputerName and
      LocalHostName are still the FACTORY DEFAULTS ("Malcolm's Mac mini" /
      Malcolms-Mac-mini); only HostName was ever set, to `mactop`, which is
      the sole source of the `mactop` name the fleet has been seeing. The
      three settable names disagree. Canonical fleet name stays minitop
      (owner decision 2026-08-31): the asserts state the target and all
      three live names are tracked drift. Auto-resolution works today via the
      `mactop` alias (HostName) -- no exit-3 ambiguity with supertop.
    identity:
      profile: personal
      aliases: [mactop, mac-mini, Malcolms-Mac-mini]
      match:
        arch: arm64
        username: bossjones
        os: darwin
      assert:
        computer_name: minitop
        local_host_name: minitop
        os_major: 26

    drift:
      # --- identity: three settable names, three different values ----------

      - id: minitop-computer-name-factory-default
        title: ComputerName is still the factory default
        type: hostname
        observed: "2026-08-31"
        expected: minitop
        tracked: "#116"
        traces: [Q6, Q10, Q12]
        which: computer
        want: "Malcolm’s Mac mini"
        fix: |
          Never renamed. Apple's default on this generation embeds the owner's
          first name (with a U+2019 apostrophe), so the old "bare Mac"
          hypothesis could never have matched this machine. Set by the Q12
          hostname setter during migration (operator-reviewed, needs sudo);
          feeds from the computer_name data key once that key is corrected.

      - id: minitop-local-host-name-factory-default
        title: LocalHostName is still the factory default
        type: hostname
        observed: "2026-08-31"
        expected: minitop
        tracked: "#116"
        traces: [Q6, Q10, Q12]
        which: local
        want: Malcolms-Mac-mini
        fix: |
          Same remedy as ComputerName. Until then the Malcolms-Mac-mini alias
          above keeps auto-resolution unambiguous even if HostName is unset.

      - id: minitop-host-name-set-mactop
        title: HostName is explicitly set to mactop (fleet doctrine is unset)
        type: hostname
        observed: "2026-08-31"
        expected: unset, or minitop if Q12 sets HostName fleet-wide
        tracked: "#116"
        traces: [Q10, Q12]
        which: host
        want: mactop
        fix: |
          This is the ONLY reason `hostname`, kern.hostname and
          .chezmoi.hostname read `mactop`: HostName overrides the derived
          LocalHostName.local. adobetop and supertop both leave HostName
          unset (the macOS default). Q12 decides whether the fleet sets it;
          either way this value goes when the machine is renamed.

      # --- chezmoi: binary, source checkout, config -------------------------

      - id: minitop-source-checkout-stale
        title: ~/.local/share/chezmoi sits on a merged branch, 83 behind main
        type: command
        observed: "2026-08-31"
        expected: main, fast-forwarded to origin/main
        tracked: "#116"
        traces: [C2]
        run: git -C ~/.local/share/chezmoi rev-parse --abbrev-ref HEAD
        want_stdout: feature-asdf-to-mise
        fix: |
          Branch feature-asdf-to-mise (3571b56, 2026-06-02) merged as PR #83
          and its remote was deleted; HEAD is an ancestor of origin/main, so
          `git checkout main && git pull --ff-only` loses nothing.
          Side effects while stale: (1) the common `no-resurrected-files`
          check FAILS here -- `diff --diff-filter=A origin/main HEAD` lists
          .claude/ files that main has since DELETED, not files this machine
          resurrected; (2) `chezmoi-config-has-every-key` and
          `chezmoi-templates-render` PASS only because the old template still
          declares the old myAsdf* keys. Against main's template, `chezmoi
          status` fails with `map has no entry for key "myRubyVersion"`.

      - id: minitop-chezmoi-binary-stale
        title: chezmoi is the 2023 v2.31.1 build in ~/.bin
        type: binary
        observed: "2026-08-31"
        expected: v2.72.0 (the fleet version on adobetop and supertop)
        tracked: "#129"
        traces: [C3]
        name: chezmoi
        in_dir: ~/.bin
        version_matching: 'v2\.31\.1'
        fix: |
          Same vintage supertop replaced (personal spec F2); the recipe there
          applies verbatim. Hash the old binary into the backup first.

      - id: minitop-stale-version-key-names
        title: config carries the pre-rename myAsdf*Version keys
        type: command
        observed: "2026-08-31"
        expected: the my*Version names the template now declares
        tracked: "#129"
        traces: [C3]
        run: chezmoi data --format json
        want_stdout_matching: '"myAsdfRubyVersion"'
        fix: |
          19 keys, adobetop's class exactly -- masked today only by the stale
          checkout (see minitop-source-checkout-stale). Re-running
          `chezmoi init` regenerates all of them.

      - id: minitop-missing-chezmoi-keys
        title: chezmoi config predates fzf_tab, myFzfTabRev, myPyenvPythonVersion
        type: command
        observed: "2026-08-31"
        expected: all three keys present
        tracked: "#129"
        traces: [C3, Q17]
        run: chezmoi data --format json
        want_stdout_not_matching: '"myFzfTabRev"'
        fix: |
          ABSENT, not wrong -- hasKey is false, so a plain `chezmoi init`
          re-run prompts for them. Never hand-edit fzf_tab to true.

      - id: minitop-stale-identity-data-keys
        title: the hostname data key still says bossworkstation
        type: chezmoi_data
        observed: "2026-08-31"
        expected: minitop
        tracked: "#116"
        traces: [Q6, Q12]
        key: hostname
        want: bossworkstation
        fix: |
          computer_name ("boss workstation") shares the fate. Present-but-wrong
          and therefore STICKY: hasKey short-circuits the prompt and
          --promptString is a silent no-op. Corrective init needs --data=false
          or a prior hand-edit. Note version_manager is already mise here, so
          unlike supertop that key needs no correction.

      - id: minitop-feature-flags-false
        title: every feature flag is false while the tools are live
        type: chezmoi_data
        observed: "2026-08-31"
        expected: pyenv, fnm, ruby, nodejs, k8s all true (owner, #137 P2)
        tracked: "#116"
        traces: [C1]
        key: pyenv
        want: false
        fix: |
          pyenv 3.12.8 owns python3, fnm owns node 20.19.5, ruby 3.4.9 and the
          k8s toolset are installed via mise -- all five flags say false. The
          non-TTY all-false trap, or a first init before the tools existed.
          Present-but-wrong => sticky => the same --data=false init that fixes
          computer_name/hostname. cuda/opencv stay false (Q8); fzf_tab is
          ABSENT and becomes present-and-false at that init.

      # --- git / shell / dotfiles -------------------------------------------

      - id: minitop-hub-host-adobe
        title: global hub.host points at Adobe's GHE on a personal machine
        type: git_config
        observed: "2026-08-31"
        expected: key absent on profile=personal
        tracked: "#119"
        traces: [M2]
        key: hub.host
        want: git.corp.adobe.com
        fix: |
          hub IS installed (/opt/homebrew/bin/hub) and alias.pr routes through
          it, so `git pr` targets git.corp.adobe.com here. Fixed by the profile
          gate (S3/M2), not by hand-editing the live file. The live ~/.gitconfig
          is byte-identical to the rendered template (chezmoi diff is clean).

      - id: minitop-zshrc-local-present
        title: ~/.zshrc.local exists with stale values
        type: file_exists
        observed: "2026-08-31"
        expected: file removed
        tracked: "#129"
        traces: [S7]
        path: ~/.zshrc.local
        fix: |
          3.4K, RBENV_VERSION=2.7.2 and export SHELL=... -- the same content as
          supertop's. Still chezmoi-managed on this machine because the stale
          checkout predates S7. Nothing sources it.

      - id: minitop-tmux-conf-absolute-symlink
