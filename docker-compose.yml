# Docker Compose for local smoke testing
# Reproduces CI environment for faster iteration
#
# Usage:
#   docker-compose up --build                              # Run full smoke test (asdf default)
#   docker-compose run --rm smoke lint                     # Run lint stage only
#   docker-compose run --rm smoke build                    # Run build stage only
#   docker-compose run --rm smoke-shell                    # Interactive shell for debugging
#   VERSION_MANAGER=mise docker compose up --build smoke   # Test mise lane
#
# For faster builds with GitHub API token (avoids rate limiting):
#   export HOMEBREW_GITHUB_API_TOKEN=ghp_your_token_here
#   docker-compose build
#
services:
  smoke:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION_MANAGER: ${VERSION_MANAGER:-asdf}
      secrets:
        - homebrew_token
    container_name: dotfiles-smoke
    environment:
      - TERM=xterm-256color
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_ANALYTICS=1
      - VERSION_MANAGER=${VERSION_MANAGER:-asdf}

  # CUDA shell-module verification against real NVIDIA apt packages (no GPU).
  # Jammy on purpose: NVIDIA's repos are per-distro and the host is 22.04.
  cuda-verify:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_SERIES: ${CUDA_SERIES:-13-0}
    container_name: dotfiles-cuda-verify
    environment:
      - TERM=xterm-256color
      - CUDA_SERIES=${CUDA_SERIES:-13-0}

  cuda-verify-shell:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_SERIES: ${CUDA_SERIES:-13-0}
    container_name: dotfiles-cuda-verify-shell
    environment:
      - TERM=xterm-256color
      - CUDA_SERIES=${CUDA_SERIES:-13-0}
    stdin_open: true
    tty: true
    entrypoint: /bin/bash

  # GPU / driver-compatibility verification. REQUIRES nvidia-container-toolkit.
  #
  # The `devices` entry below is the CDI form, which needs no daemon.json edit and
  # no docker restart (Docker 25+ with CDI enabled -- check `docker info | grep -i cdi`).
  # Generate the spec once: sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  #
  # If you configured the nvidia *runtime* instead
  # (`sudo nvidia-ctk runtime configure --runtime=docker` + daemon restart), delete
  # the `devices` list and use this instead:
  #     deploy:
  #       resources:
  #         reservations:
  #           devices:
  #             - driver: nvidia
  #               count: all
  #               capabilities: [gpu]
  gpu-verify:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:13.0.0-devel-ubuntu22.04}
    container_name: dotfiles-gpu-verify
    devices:
      - nvidia.com/gpu=all
    environment:
      - TERM=xterm-256color
      - MIN_DRIVER=${MIN_DRIVER:-}

  gpu-verify-shell:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:13.0.0-devel-ubuntu22.04}
    container_name: dotfiles-gpu-verify-shell
    devices:
      - nvidia.com/gpu=all
    environment:
      - TERM=xterm-256color
    stdin_open: true
    tty: true
    entrypoint: /bin/bash

  # Interactive shell for debugging failed tests
  smoke-shell:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION_MANAGER: ${VERSION_MANAGER:-asdf}
      secrets:
        - homebrew_token
    container_name: dotfiles-smoke-shell
    environment:
      - TERM=xterm-256color
      - HOMEBREW_NO_AUTO_UPDATE=1
      - HOMEBREW_NO_ANALYTICS=1
      - VERSION_MANAGER=${VERSION_MANAGER:-asdf}
    stdin_open: true
    tty: true
    entrypoint: /bin/zsh

# BuildKit secrets - reads token from environment variable
# Token is only available during build, never persisted in image layers
secrets:
  homebrew_token:
    environment: HOMEBREW_GITHUB_API_TOKEN
